k":"#0B2241","primaryLight":"#FFFFFF","secondaryLight":"#EEEEEE","primaryAccent":"#CECECE","secondaryAccent":"#C8102E","link":"#C8102E"},"id":"1610612746","timezone":"America/Los_Angeles","seasonYear":{"courtsideBox":"2026-27","draft":"2026-27","leaders":"2026-27","roster":"2026-27","schedule":"2026-27","scheduleMax":"2026-27","singleTickets":"2026-27","singleTicketsMax":"2025-26"},"languages":{"zh-hans":null},"draftBoard":{"enabled":false,"theme":"light","useDefaultUrl":true,"promotionUrl":"https://www.nba.com/draft/2026/draft-board","promotionalText":"Full Draft Board","profilesEnabled":true,"playerLinkEnabled":true,"sponsorship":[]},"displayFreeAgentStatus":false,"navigation":{"enableCompactHeader":false},"gtmTag":"GTM-MPNZPNF","googleSiteVerificationCode":"","adobeLaunchUrl":"","currentSeasonYear":"2026-27"},"article":{},"gallery":{},"personalization":{}},"pageObject":{"id":16375,"type":"article","name":"six-things-to-know-about-steve-ballmer","title":"Six Things to Know about Steve Ballmer","status":"publish","slug":"six-things-to-know-about-steve-ballmer","permalink":"https://www.nba.com/clippers/six-things-know-about-steve-ballmer","excerpt":"Six things to know about Steve Ballmer.","timestamp":1407862020000,"date":"2014-08-12T16:47:00Z","modified":"2014-08-12T16:47:00Z","featuredImage":{"src":"https://cdn.nba.com/teams/legacy/www.nba.com/clippers/sites/clippers/files/ballmer-sixthings-140812.jpg","alt":"","link":"","caption":"","type":"image","align":"","size":{"width":512,"height":512},"html":null,"attributes":{"size":{"width":512,"height":512},"src":"https://cdn.nba.com/teams/legacy/www.nba.com/clippers/sites/clippers/files/ballmer-sixthings-140812.jpg","alt":"","link":"","caption":"","id":"1048115","credit":"","align":"","caption_color":""},"text":null,"id":"1048115","credit":"","caption_color":""},"category":"","language":"en","taxonomy":{"tags":{"steve-ballmer":"Steve Ballmer"}},"seo":{"canonicalUrl":"","keywords":"","general":{"title":null,"description":null},"twitter":{"image":null,"description":null,"title":null},"facebook":{"image":null,"description":null,"title":null}},"attributes":{},"syndication":{"amp":{"enabled":false},"platforms":{"app":true,"web":true}},"contentStructured":[{"html":"\u003col\u003e\u003cli\u003eHe is a Detroit native of Swiss, Jewish and Iranian ancestry. He attended school in the Detroit area before heading off to college at Harvard. He had a perfect score of 800 on the mathematical section of the SAT. At Harvard, Ballmer worked on the school newspaper and became friends with his fellow classmate, Bill Gates. Steve graduated from Harvard and headed to Stanford Graduate School of Business. In 1980, three years after he started, he dropped out of school to go join his buddy Bill Gates at his company called Microsoft.\u003c/li\u003e\n\u003cli\u003eBallmer joined Microsoft on June 11, 1980 and worked his way up all the way to CEO where he was hired in January of 2000. On February 4, 2014, Ballmer retired from Microsoft. During his 14-year tenure as CEO, Microsoft nearly tripled their annual revenue, increased its net income over 200% and diversified their products to new reaches.\u003c/li\u003e\n\u003cli\u003eBallmer and his wife, Connie, are very big into charitable work and love to do whatever they can to help kids. The Ballmers gave a $10 million donation to Partners for our Children, a group which seeks to improve the child welfare system in Washington State. In 2012 as CEO, Ballmer was on hand as Microsoft as they introduced the largest philanthropic initiative in its history—a $500 million three-year effort to expand opportunities for global youth called YouthSpark.\u003c/li\u003e\n\u003cli\u003eHe has a HUGE passion for sports and always has from his early days as a student manager of his basketball team in high school and a manager for Harvard’s football team in college. He regularly plays golf, loves to still play basketball as he proclaims himself a ‘gym rat’ and has been involved in trying to purchase an NBA team for years before coming to terms to buy the Clippers. He recently won a charity golf tournament in Seattle with his partner, former golf great Fred Couples.\u003c/li\u003e\n\u003cli\u003eHe often drives a FORD in nod to his late father who worked for FORD as a manager while Steve was growing up in Detroit.\u003c/li\u003e\n\u003cli\u003eEnergy, Energy, Energy! Ballmer has it and then some. He is very well known for his eccentric speeches at Microsoft, motivational quotes and his videos over the years. He once did a great spoof of “Night at the Roxbury” with Bill Gates. Look for that same passion at STAPLES Center this season!\u003c/li\u003e\n\u003c/ol\u003e","attributes":{"ordered":true},"text":null,"type":"list"},{"html":"\u003cp\u003e\u003ca href=\"https://www.nba.com/clippers/gallery/photos-steve-ballmer\"\u003eGALLERY: STEVE BALLMER ►\u003c/a\u003e\u003c/p\u003e","attributes":[],"text":"GALLERY: STEVE BALLMER ►","type":"paragraph"}],"flexModules":[],"contentExpanded":[{"attributes":{"ordered":true},"type":"list","html":"\u003col\u003e\u003cli\u003eHe is a Detroit native of Swiss, Jewish and Iranian ancestry. He attended school in the Detroit area before heading off to college at Harvard. He had a perfect score of 800 on the mathematical section of the SAT. At Harvard, Ballmer worked on the school newspaper and became friends with his fellow classmate, Bill Gates. Steve graduated from Harvard and headed to Stanford Graduate School of Business. In 1980, three years after he started, he dropped out of school to go join his buddy Bill Gates at his company called Microsoft.\u003c/li\u003e\n\u003cli\u003eBallmer joined Microsoft on June 11, 1980 and worked his way up all the way to CEO where he was hired in January of 2000. On February 4, 2014, Ballmer retired from Microsoft. During his 14-year tenure as CEO, Microsoft nearly tripled their annual revenue, increased its net income over 200% and diversified their products to new reaches.\u003c/li\u003e\n\u003cli\u003eBallmer and his wife, Connie, are very big into charitable work and love to do whatever they can to help kids. The Ballmers gave a $10 million donation to Partners for our Children, a group which seeks to improve the child welfare system in Washington State. In 2012 as CEO, Ballmer was on hand as Microsoft as they introduced the largest philanthropic initiative in its history—a $500 million three-year effort to expand opportunities for global youth called YouthSpark.\u003c/li\u003e\n\u003cli\u003eHe has a HUGE passion for sports and always has from his early days as a student manager of his basketball team in high school and a manager for Harvard’s football team in college. He regularly plays golf, loves to still play basketball as he proclaims himself a ‘gym rat’ and has been involved in trying to purchase an NBA team for years before coming to terms to buy the Clippers. He recently won a charity golf tournament in Seattle with his partner, former golf great Fred Couples.\u003c/li\u003e\n\u003cli\u003eHe often drives a FORD in nod to his late father who worked for FORD as a manager while Steve was growing up in Detroit.\u003c/li\u003e\n\u003cli\u003eEnergy, Energy, Energy! Ballmer has it and then some. He is very well known for his eccentric speeches at Microsoft, motivational quotes and his videos over the years. He once did a great spoof of “Night at the Roxbury” with Bill Gates. Look for that same passion at STAPLES Center this season!\u003c/li\u003e\n\u003c/ol\u003e","text":null},{"attributes":[],"type":"paragraph","html":"\u003cp\u003e\u003ca href=\"https://www.nba.com/clippers/gallery/photos-steve-ballmer\"\u003eGALLERY: STEVE BALLMER ►\u003c/a\u003e\u003c/p\u003e","text":"GALLERY: STEVE BALLMER ►"}],"authors":[{"id":759,"slug":"marcus-fong","name":"Marcus Fong","firstName":"","lastName":"","organization":"","isNBAStaff":false,"authorPhoto":"","socialHandle":"","socialLink":"","wpseoTitle":"","wpseoMetadesc":"","description":""
