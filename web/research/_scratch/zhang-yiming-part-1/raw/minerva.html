        return null;
      }
      if (TARGET_HOSTS.indexOf(url.hostname) === -1) return null;
      var changed = false;
      Object.keys(params).forEach(function (key) {
        if (!url.searchParams.has(key)) {
          url.searchParams.set(key, params[key]);
          changed = true;
        }
      });
      return changed ? url.toString() : null;
    }

    function decorateAll() {
      var links = document.querySelectorAll('a[href]');
      for (var i = 0; i < links.length; i++) {
        var next = decorate(links[i].getAttribute('href'));
        if (next) links[i].setAttribute('href', next);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', decorateAll);
    } else {
      decorateAll();
    }

    document.addEventListener(
      'click',
      function (event) {
        var anchor = event.target && event.target.closest ? event.target.closest('a[href]') : null;
        if (!anchor) return;
        var next = decorate(anchor.getAttribute('href'));
        if (next) anchor.setAttribute('href', next);
      },
      true,
    );
  })();
</script>
